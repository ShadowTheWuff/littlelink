name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" VERCEL_TOKEN="$VERCEL_TOKEN" --repo Shadowdewuff/temp_depot
  cleanup:
    needs: [secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
