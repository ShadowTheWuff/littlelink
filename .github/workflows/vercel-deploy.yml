name: Deploy to Vercel

# Deploys through the Vercel CLI on a Namespace runner, instead of Vercel's
# own Git integration (switched off in vercel.json so nothing deploys twice).
# Pushes to main go to production; pull requests get a preview.
#
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID,
# and the Namespace GitHub app installed on this repository so the
# namespace-profile-main runner profile below has somewhere to run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Pull requests from forks get no secrets, so they have nothing to deploy with.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-main
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'Preview' || 'Production' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ENV: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # Keeps Node and npm's download cache on a Namespace cache volume between
      # runs, so neither setup-node nor the global CLI install below has to
      # download them again. Needs caching turned on for the
      # namespace-profile-main runner profile.
      - name: Set up Node and npm cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ runner.tool_cache }}/node
            /home/runner/.npm

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="${{ secrets.VERCEL_TOKEN }}"

      # Builds locally into .vercel/output (static files plus middleware.js),
      # so Vercel only has to upload what was built here.
      - name: Build
        run: |
          if [ "$VERCEL_ENV" = production ]; then
            vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          fi

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          if [ "$VERCEL_ENV" = production ]; then
            url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          else
            url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url ($VERCEL_ENV)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nPreview for ${context.sha.slice(0, 7)}: ${process.env.DEPLOY_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
