<!DOCTYPE html>
<!--
  Without an index file here, Vercel's static file server auto-generates a
  directory listing for /.well-known/, exposing the names of every file in
  it. This file exists only to replace that listing with nothing of
  interest; it carries no content of its own.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title></title>
  </head>
  <body></body>
</html>
